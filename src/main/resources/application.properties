# Nome da Aplicação
spring.application.name=gerenciamento-aeroportos

# Configuração do Banco de Dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/aeroportos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=ghs1234@#

# Configurações do JPA / Hibernate
# 'update' faz o Java criar/atualizar as tabelas automaticamente baseado no código
spring.jpa.hibernate.ddl-auto=update
# Mostra os comandos SQL no console 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect